
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      .track {
        fill: none;
        stroke: #c9d1d9;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .node {
        stroke: #0d1117;
        stroke-width: 4;
      }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 110px;
        letter-spacing: -3px;
        fill: #f0f6fc;
      }

      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 5px;
        fill: #8b949e;
      }

      .payload {
        fill: #ffffff;
        stroke: #c9d1d9;
        stroke-width: 4;
      }

      /* Entrance Animation */
      .fade-in {
        opacity: 0;
        animation: smooth-appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes smooth-appear {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      ]]>
    </style>
  </defs>

  <!-- Animated Container -->
  <g class="fade-in">
    
    <!-- The Continuous Git-Branch Pipeline (Forms the 'G') -->
    <path id="pipeline" class="track" d="M 230 80 L 130 80 C 70 80, 40 115, 40 155 C 40 195, 70 230, 130 230 L 205 230 C 220 230, 230 220, 230 205 L 230 180 C 230 165, 220 155, 205 155 L 140 155" />

    <!-- Environment Nodes -->
    <!-- 1. Build Registry -->
    <circle class="node" cx="210" cy="80" r="11" fill="#0ea5e9" />
    
    <!-- 2. LLM Risk Assessment -->
    <circle class="node" cx="40" cy="155" r="11" fill="#8b5cf6" />
    
    <!-- 3. Staging Environment -->
    <circle class="node" cx="180" cy="230" r="11" fill="#f59e0b" />
    
    <!-- 4. Production (ArgoCD / Target) -->
    <circle class="node" cx="140" cy="155" r="13" fill="#10b981" />

    <!-- The "Gondola" Data Payload that travels the pipeline -->
    <circle class="payload" r="8">
      <!-- Universal motion path animation -->
      <animateMotion 
        dur="3.5s" 
        repeatCount="indefinite" 
        calcMode="spline"
        keyTimes="0; 1"
        keySplines="0.4 0 0.2 1"
        path="M 230 80 L 130 80 C 70 80, 40 115, 40 155 C 40 195, 70 230, 130 230 L 205 230 C 220 230, 230 220, 230 205 L 230 180 C 230 165, 220 155, 205 155 L 140 155" />
    </circle>

    <!-- Typography -->
    <text x="280" y="170" class="title">Gondola</text>
    <text x="285" y="215" class="subtitle">DEPLOYMENT ORCHESTRATION</text>

  </g>
</svg>
